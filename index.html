
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MahaKart - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🛍️ MahaKart</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#cart">Cart</a>
            <a href="#account">Account</a>
        </nav>
    </header>

    <section class="welcome">
        <h2>Welcome to MahaKart!</h2>
        <p>Your favourite products, all in one place.</p>
    </section>

    <main>
        <section id="products">
            <h2>Our Products</h2>
            <div id="productList" class="product-list"></div>
        </section>

        <section id="cart">
            <h2>Shopping Cart</h2>
            <div id="cartItems"></div>
            <h3>Total: ₹<span id="cartTotal">0</span></h3>
            <button id="checkoutBtn">Place Order</button>
        </section>

        <section id="account">
    <h2>My Account</h2>
    <h3>My Order History</h3>
<button id="viewOrdersBtn">View My Orders</button>
<div id="orderHistory"></div>


    <h3>Register</h3>
    <form id="registerForm">
        <input type="text" id="registerName"
            placeholder="Your Name" required>

        <input type="email" id="registerEmail"
            placeholder="Email Address" required>

        <input type="password" id="registerPassword"
            placeholder="Password" required>

        <button type="submit">Register</button>
    </form>

    <h3>Login</h3>
    <form id="loginForm">
        <input type="email" id="loginEmail"
            placeholder="Email Address" required>

        <input type="password" id="loginPassword"
            placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p id="accountMessage"></p>
</section>
    </main>

    <footer>
        <p>© 2026 MahaKart. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
