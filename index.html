
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Expense Tracker</h1>
        <p>Manage your income and expenses easily.</p>

        <div class="summary">

            <div class="card">
                <h3>Total Income</h3>
                <h2 id="totalIncome">₹0.00</h2>
            </div>

            <div class="card">
                <h3>Total Expense</h3>
                <h2 id="totalExpense">₹0.00</h2>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <h2 id="balance">₹0.00</h2>
            </div>

        </div>

        <h2>Add Transaction</h2>

        <form id="expenseForm">

            <input
                type="text"
                id="title"
                placeholder="Transaction Title"
                required
            >

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                min="0.01"
                step="0.01"
                required
            >

            <select id="type" required>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
            </select>

            <input
                type="text"
                id="category"
                placeholder="Category"
                required
            >

            <input
                type="date"
                id="date"
                required
            >

            <button type="submit">Add Transaction</button>

        </form>

        <h2>Transaction History</h2>

        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Type</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="transactionList">
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
