
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobConnect Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>JobConnect Admin</h1>
        <nav>
    <a href="index.html">Home</a>
    <a href="admin.html">Add Jobs</a>
    <a href="applications.html">Applications</a>
    <a href="edit-job.html">Edit Jobs</a>
</nav>
    </header>

    <section class="admin-section">
        <h2>Add New Job</h2>

        <form id="jobForm">
            <input type="text" id="title" placeholder="Job Title" required>

            <input type="text" id="company" placeholder="Company Name" required>

            <input type="text" id="location" placeholder="Job Location" required>

            <input type="text" id="salary" placeholder="Salary (e.g. ₹5 - 8 LPA)" required>

            <button type="submit">Add Job</button>
        </form>

        <p id="message"></p>
    </section>

    <script src="admin.js"></script>
</body>
</html>
