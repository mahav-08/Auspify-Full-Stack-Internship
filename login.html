
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | LearnHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h2>LearnHub</h2>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <section class="register-section">
        <h2>Student Login</h2>

        <form id="loginForm">
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p id="loginMessage"></p>
    </section>

    <script src="login.js"></script>

</body>
</html>
